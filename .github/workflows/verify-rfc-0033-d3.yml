name: Verify RFC 0033 D3 Pocket gate
on:
  push:
    branches: [verify/rfc-0033-d3]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-disabled: true
      - name: Run Pocket gate without device fixtures
        shell: bash
        run: |
          set -euo pipefail
          cp .automagik/verify-0033-d3.init.gradle "$RUNNER_TEMP/verify-0033-d3.init.gradle"
          rm -rf apps/pocket/android/app/src/androidTest .automagik
          cd apps/pocket/android
          ./gradlew --init-script "$RUNNER_TEMP/verify-0033-d3.init.gradle" --no-daemon --max-workers=2 --stacktrace \
            :app:assembleGithubDebug :app:testGithubDebugUnitTest :app:lintGithubDebug \
            :app:testPlayDebugUnitTest :app:lintPlayDebug
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rfc-0033-d3-gate-${{ github.run_id }}
          path: |
            apps/pocket/android/app/build/reports/
            apps/pocket/android/app/build/test-results/
          if-no-files-found: warn
          retention-days: 3

  device:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        api: [26, 28, 29, 35]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.9.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Install disposable harness dependencies
        shell: bash
        working-directory: apps/bots-dsh
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run harness
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-disabled: true
      - name: Boot disposable API ${{ matrix.api }} emulator
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          artifact="$RUNNER_TEMP/rfc-0033-d3-device-api${{ matrix.api }}"
          mkdir -p "$artifact"
          boot_failure() {
            result=$?
            if [ "$result" -ne 0 ]; then
              echo 'FAILED: emulator_boot' >&2
              timeout 20 adb exec-out uiautomator dump /dev/tty > "$artifact/failure-ui.txt" 2>/dev/null || :
              timeout 20 adb logcat -d -t 1000 > "$artifact/failure-logcat.txt" 2>/dev/null || :
            fi
          }
          trap boot_failure EXIT
          image='system-images;android-${{ matrix.api }};google_apis;x86_64'
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || :
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'emulator' "$image"
          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --name pocket0033 --package "$image" --force
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -qx pocket0033
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd pocket0033 -no-window -no-audio \
            -no-snapshot -no-boot-anim -gpu swiftshader_indirect -accel on \
            > "$artifact/emulator.log" 2>&1 &
          timeout 180 adb wait-for-device
          for attempt in {1..120}; do
            if [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == 1 ]]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell input keyevent 82
          printf 'emulator_booted=true\n' > "$artifact/assertions.txt"
      - name: Verify installed Pocket on API ${{ matrix.api }}
        shell: bash
        run: bash .automagik/verify-0033-d3-device.sh
      - name: Preserve device evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rfc-0033-d3-device-api${{ matrix.api }}-${{ github.run_id }}
          path: ${{ runner.temp }}/rfc-0033-d3-device-api${{ matrix.api }}/
          if-no-files-found: warn
          retention-days: 3

