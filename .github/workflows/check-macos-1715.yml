name: Issue 1715 macOS fixtures
on:
  push:
    branches: [verify/issue-1715-fixtures-t1by]
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15-intel
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/acp-dsh
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.9.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile && bun run harness
      - name: Verify native session-file consent on macOS
        env:
          AUTOMAGIK_REQUIRE_SESSION_FILE_TEST: '1'
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/issue-1715-tools"
          npm install --prefix "$prefix" --no-audit --no-fund @openai/codex@0.167.1 @agentclientprotocol/codex-acp@2.8.0
          export AUTOMAGIK_TEST_CODEX="$prefix/node_modules/@openai/codex-darwin-x64/vendor/x86_64-apple-darwin/bin/codex"
          export AUTOMAGIK_TEST_CODEX_ACP="$prefix/node_modules/@agentclientprotocol/codex-acp/dist/index.js"
          test -x "$AUTOMAGIK_TEST_CODEX"
          test -f "$AUTOMAGIK_TEST_CODEX_ACP"
          node --import ./test/harness-resolve.mjs --test test/session-files-native.test.js
