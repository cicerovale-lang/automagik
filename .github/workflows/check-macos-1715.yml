name: Issue 1715 macOS fixtures
on:
  push:
    branches: [verify/issue-1715-fixtures-t1by]
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15-intel
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/acp-dsh
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.9.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile && bun run harness
      - name: Verify the two corrected upload handles on macOS
        run: node --import ./test/harness-resolve.mjs --test --test-name-pattern="^the complete handle for" test/group-uploads.test.js
